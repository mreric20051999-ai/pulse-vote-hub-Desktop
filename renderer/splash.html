<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulse Vote Hub Desktop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    /* Splash screen specific styles */
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: var(--bg);
    }

    .splash {
      position: relative;
      z-index: 1;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--space-6);
      animation: splashIn 600ms cubic-bezier(0.4, 0, 0.2, 1);
    }

    .splash-logo {
      width: 112px;
      height: 112px;
      border-radius: 26px;
      background: var(--surface);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      box-shadow: var(--shadow-lg);
      animation: logoFloat 2s ease-in-out infinite;
    }
    .splash-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .splash-title {
      font-family: var(--font-heading);
      font-size: 1.75rem;
      font-weight: var(--fw-bold);
      color: var(--text);
      letter-spacing: -0.02em;
    }
    .splash-tagline {
      font-family: var(--font-body);
      font-size: var(--fs-sm);
      font-weight: var(--fw-medium);
      color: var(--text-muted);
      margin-top: -8px;
      letter-spacing: 0.02em;
    }

    .splash-loader {
      margin-top: var(--space-2);
      display: flex;
      align-items: center;
      gap: var(--space-3);
    }
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .splash-loader span {
      font-family: var(--font-body);
      font-size: var(--fs-xs);
      font-weight: var(--fw-medium);
      color: var(--text-dim);
      letter-spacing: 0.06em;
    }

    .splash-footer {
      position: fixed;
      bottom: var(--space-6);
      z-index: 1;
      font-family: var(--font-body);
      font-size: var(--fs-xs);
      font-weight: var(--fw-medium);
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    /* ---------- Premium background ---------- */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(1200px 800px at 15% -10%, rgba(37, 99, 235, 0.28), transparent 55%),
        radial-gradient(1000px 700px at 100% 110%, rgba(185, 28, 28, 0.20), transparent 55%),
        radial-gradient(900px 600px at 85% -10%, rgba(30, 64, 175, 0.32), transparent 60%),
        var(--bg);
    }
    /* subtle grid texture — Swiss/geometric */
    .bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(var(--border-strong) 1px, transparent 1px),
        linear-gradient(90deg, var(--border-strong) 1px, transparent 1px);
      background-size: 64px 64px;
      opacity: 0.14;
      -webkit-mask-image: radial-gradient(circle at 50% 40%, #000 20%, transparent 78%);
      mask-image: radial-gradient(circle at 50% 40%, #000 20%, transparent 78%);
    }
    /* heartbeat pulse line — echoes the red logo */
    .bg svg {
      position: absolute;
      left: 50%;
      bottom: 16%;
      width: 620px;
      transform: translateX(-50%);
      opacity: 0.10;
    }

    @keyframes splashIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes traceLine {
      from { stroke-dashoffset: 340; }
      to { stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true">
    <svg viewBox="0 0 600 120" fill="none" preserveAspectRatio="xMidYMid meet">
      <path d="M0 60 H120 L140 60 L158 28 L178 92 L196 40 L208 60 H260 L282 60 L298 34 L318 86 L336 42 L348 60 H420 L442 60 L458 26 L478 96 L496 38 L512 60 H600"
        stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="340" style="animation: traceLine 2.6s ease-in-out infinite;"/>
    </svg>
  </div>
  <div class="splash">
    <div class="splash-logo">
      <img src="assets/images/logo.png" alt="Pulse Vote Hub">
    </div>
    <div>
      <div class="splash-title">Pulse Vote Hub</div>
      <div class="splash-tagline">Desktop Election System</div>
    </div>
    <div class="splash-loader">
      <div class="spinner"></div>
      <span>Initializing...</span>
    </div>
  </div>

  <div class="splash-footer">Secure Offline Voting</div>
</body>
</html>
