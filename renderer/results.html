<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' ws: wss: http: https:;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Results &middot; Pulse Vote Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/officers.css">
  <link rel="stylesheet" href="css/results.css">
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="assets/images/logo.png" alt="Pulse Vote Hub">
      <span>Pulse Vote Hub</span>
    </div>
    <nav class="sidebar-nav" id="nav">
      <a class="nav-item" href="dashboard.html" data-nav="dashboard"><span class="icon nav-ic" data-icon="dashboard"></span>Dashboard</a>
      <a class="nav-item" href="elections.html" data-nav="elections"><span class="icon nav-ic" data-icon="elections"></span>Elections</a>
      <a class="nav-item" href="voters.html" data-nav="voters"><span class="icon nav-ic" data-icon="voters"></span>Voters</a>
      <a class="nav-item" href="stations.html" data-nav="stations"><span class="icon nav-ic" data-icon="officers"></span>Stations</a>
      <a class="nav-item" href="vote.html" data-nav="vote"><span class="icon nav-ic" data-icon="vote"></span>Vote</a>
      <a class="nav-item" href="officers.html" data-nav="officers"><span class="icon nav-ic" data-icon="officers"></span>Officers</a>
      <a class="nav-item" href="results.html" data-nav="results"><span class="icon nav-ic" data-icon="results"></span>Results</a>
      <a class="nav-item" href="location-runs.html" data-nav="location-runs"><span class="icon nav-ic" data-icon="globe"></span>Location Runs</a>
      <a class="nav-item admin-only" href="administration.html" data-nav="admin"><span class="icon nav-ic" data-icon="admin"></span>Administration</a>
      <a class="nav-item developer-only" href="developer.html" data-nav="developer"><span class="icon nav-ic" data-icon="code"></span>Developer</a>

    </nav>
    <div class="sidebar-footer" id="sidebar-footer"></div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Results</h1>
        <p id="page-subtitle">Professional results report for your elections.</p>
      </div>
      <div class="page-actions" id="results-actions" style="display:none;">
        <button class="btn btn-primary" id="declaration-btn" title="Open the official declaration of results"><span class="icon btn-icon" data-icon="check"></span>Official Declaration</button>
        <button class="btn btn-secondary" id="export-csv-btn" title="Export results to CSV"><span class="icon btn-icon" data-icon="download"></span>CSV</button>
        <button class="btn btn-secondary" id="export-html-btn" title="Export results as a standalone HTML report"><span class="icon btn-icon" data-icon="download"></span>HTML</button>
        <button class="btn btn-secondary" id="export-pdf-btn" title="Save results as a PDF report"><span class="icon btn-icon" data-icon="download"></span>PDF</button>
        <button class="btn btn-secondary" id="print-btn" title="Print report"><span class="icon btn-icon" data-icon="download"></span>Print</button>
      </div>
    </div>

    <!-- Election picker -->
    <section class="card panel" id="picker-panel">
      <div class="panel-head">
        <div>
          <div class="card-title panel-title">Select election</div>
          <p class="text-muted panel-sub">Choose an election to view its official results report.</p>
        </div>
      </div>
      <div class="picker" id="election-picker">
        <p class="text-muted hint">Loading elections…</p>
      </div>
    </section>

    <!-- Report -->
    <section class="card panel ofc-section" id="report-panel" style="display:none;">
      <div id="report-root"></div>
    </section>
  </main>

  <script src="js/icons.js"></script>
  <script src="js/common.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
