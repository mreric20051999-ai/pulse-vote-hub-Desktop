<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Your Vote &middot; Pulse Vote Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/kiosk.css">
</head>
<body>
  <div class="kiosk-screen" id="kiosk-root">
    <!-- Top bar -->
    <header class="kiosk-topbar">
      <div class="kiosk-brand">
        <div class="brand">
          <img src="assets/images/logo.png" alt="Pulse Vote Hub">
          <span>Pulse Vote Hub</span>
        </div>
        <span class="kiosk-badge">VOTING</span>
      </div>
      <div class="kiosk-title" id="election-title">Secure Offline Voting</div>
      <div class="kiosk-actions">
        <button class="btn btn-ghost kiosk-back" id="kiosk-back" title="Back to election selection">Back</button>
        <button class="btn btn-primary" id="kiosk-dashboard" title="Return to the dashboard">Exit to Dashboard</button>
      </div>
    </header>

    <!-- Center content switches between screens -->
    <main class="kiosk-body" id="kiosk-content"></main>

    <!-- Status bar -->
    <footer class="kiosk-statusbar">
      <div class="left"><span>Free &amp; fair elections</span></div>
      <div class="right"><span>Ballot is stored securely on this device</span></div>
    </footer>
  </div>

  <script src="js/audio.js"></script>
  <script src="js/kiosk.js"></script>
  <script src="js/vote.js"></script>
</body>
</html>
