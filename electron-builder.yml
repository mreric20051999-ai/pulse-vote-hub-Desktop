appId: com.pulsevotehub.desktop
productName: Pulse Vote Hub
copyright: Copyright © 2026 Pulse Vote Hub

compression: normal

directories:
  output: dist
  buildResources: res

files:
  - electron/**/*
  - package.json

# renderer must live OUTSIDE the asar so loadFile and the LAN kiosk's static
# mounts (express) can read it from real disk.
extraResources:
  - from: renderer
    to: renderer

asar: true
npmRebuild: true

# Native modules must be loaded from disk, not from inside the asar archive.
asarUnpack:
  - "**/*.node"

mac:
  category: public.app-category.education
  target:
    - dmg
  artifactName: "${productName}-${version}-${arch}.${ext}"
  # Ad-hoc (unsigned) for now; add a Developer ID identity + notary service
  # for public distribution.
  identity: null

dmg:
  title: "${productName} ${version}"
  sign: false

win:
  target:
    - nsis
  artifactName: "${productName}-Setup-${version}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Pulse Vote Hub
  # Branded installer visuals (custom banner on every page incl. the
  # "just me / all users" step, and branded welcome/finish side panel).
  installerHeader: installerHeader.bmp
  installerSidebar: installerSidebar.bmp
  uninstallerSidebar: installerSidebar.bmp

# Back the electron-updater feed with this GitHub repo, so packaged installs
# auto-update from the published release assets (latest-mac.yml / latest.yml).
publish:
  provider: github
  owner: mreric20051999-ai
  repo: pulse-vote-hub-Desktop
